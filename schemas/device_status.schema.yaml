schema_name: device_status
schema_version: 1.0.0
description: "Operating status, internal DLMS/COSEM diagnostics, and breaker relay states for MS212 smart meters."
owner: "Asset Management & Device Operations"

primary_key:
  - record_id

foreign_keys:
  - column: meter_id
    references: meter_registry.meter_id

fields:
  record_id:
    type: integer
    required: true
    nullable: false
    min: 1
    description: "Unique sequential primary key identifying the 1-minute neighborhood observation."

  meter_id:
    type: string
    required: true
    nullable: false
    format: "MS212-TN-\\d{4}"
    description: "Identifier of the associated Sagemcom MS212 smart meter."

  event_timestamp:
    type: datetime
    format: "ISO8601"
    required: true
    nullable: false
    timezone: "UTC"
    description: "Meter clock observation timestamp at 1-minute sampling interval."

  breaker_state:
    type: string
    required: true
    nullable: false
    allowed_values: ["CLOSED", "OPEN"]
    description: "Physical status of the internal 100A latching disconnect relay (CLOSED: supply enabled, OPEN: disconnected)."

  auto_diagnostic:
    type: string
    required: true
    nullable: false
    allowed_values: ["OK", "WARNING", "ERROR", "ALARM"]
    description: "DLMS/COSEM self-diagnostic health code (memory, RTC clock, measurement chip, optical port)."

  quality_flags:
    type: integer
    required: true
    nullable: false
    min: 0
    description: "Bitmask integer encoding measurement validity and data quality indicators."
