schema_name: electrical_measurements
schema_version: 1.0.0
description: "Instantaneous electrical measurements collected from Sagemcom MS212 single-phase smart meters."
owner: "Grid Quality & Electrical Engineering"

primary_key:
  - record_id

foreign_keys:
  - column: meter_id
    references: meter_registry.meter_id

fields:
  record_id:
    type: integer
    required: true
    nullable: false
    min: 1
    description: "Unique sequential primary key identifying the 1-minute neighborhood observation."

  meter_id:
    type: string
    required: true
    nullable: false
    format: "MS212-TN-\\d{4}"
    description: "Identifier of the associated Sagemcom MS212 smart meter."

  event_timestamp:
    type: datetime
    format: "ISO8601"
    required: true
    nullable: false
    timezone: "UTC"
    description: "Meter clock observation timestamp at 1-minute sampling interval."

  voltage_V:
    type: float
    unit: "V"
    required: true
    nullable: true
    min: 0.0
    max: 1200.0
    description: "RMS voltage at meter terminals (STEG nominal 230 V). Nullable during transmission missing_data events."

  frequency_Hz:
    type: float
    unit: "Hz"
    required: true
    nullable: true
    min: 45.0
    max: 55.0
    description: "Grid frequency (STEG nominal 50.0 Hz). Nullable during transmission missing_data events."

  neutral_current_A:
    type: float
    unit: "A"
    required: true
    nullable: true
    min: 0.0
    max: 150.0
    description: "RMS current on the neutral conductor. Nullable during transmission missing_data events."
