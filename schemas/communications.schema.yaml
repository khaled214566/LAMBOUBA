schema_name: communications
schema_version: 1.0.0
description: "Communication transmission telemetry and gateway ingestion timestamp tracking."
owner: "Smart Grid Telecom & AMI Infrastructure"

primary_key:
  - record_id

foreign_keys:
  - column: meter_id
    references: meter_registry.meter_id

fields:
  record_id:
    type: integer
    required: true
    nullable: false
    min: 1
    description: "Unique sequential primary key identifying the 1-minute neighborhood observation."

  meter_id:
    type: string
    required: true
    nullable: false
    format: "MS212-TN-\\d{4}"
    description: "Identifier of the associated Sagemcom MS212 smart meter."

  event_timestamp:
    type: datetime
    format: "ISO8601"
    required: true
    nullable: false
    timezone: "UTC"
    description: "Meter clock observation timestamp at 1-minute sampling interval."

  ingest_timestamp:
    type: datetime
    format: "ISO8601"
    required: true
    nullable: false
    timezone: "UTC"
    description: "Timestamp when the telemetry packet was received and validated at the STEG AMI head-end gateway."

  comm_channel:
    type: string
    required: true
    nullable: false
    allowed_values: ["Cellular-4G", "G3-PLC", "W-Mbus"]
    description: "Active physical and data link communication protocol used by the MS212 meter."
